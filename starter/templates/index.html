<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Sudoku Game</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
    <div class="game-info">
      <div class="timer-section">
        <label for="timer">Time:</label>
        <span id="timer">00:00</span>
      </div>
      <div class="hints-section">
        <label for="hints-count">Hints:</label>
        <span id="hints-count">0</span>
      </div>
    </div>
  </header>
  
  <main>
    <div class="difficulty-selector">
      <label>Difficulty:</label>
      <label><input type="radio" name="difficulty" value="easy" checked> Easy (45 clues)</label>
      <label><input type="radio" name="difficulty" value="medium"> Medium (38 clues)</label>
      <label><input type="radio" name="difficulty" value="hard"> Hard (32 clues)</label>
    </div>
    
    <div id="sudoku-board"></div>
    
    <div class="controls">
      <button id="new-game">New Game</button>
      <button id="hint-button">Hint</button>
      <button id="check-solution">Check Solution</button>
      <span id="message"></span>
    </div>
    
    <div class="player-section">
      <label for="player-name">Player Name:</label>
      <input type="text" id="player-name" placeholder="Enter your name" maxlength="30">
      <button id="save-score" style="display: none;">Save Score</button>
    </div>
    
    <div class="scoreboard-section">
      <h2>Top 10 Scores</h2>
      <table id="scoreboard" class="scoreboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Time</th>
            <th>Difficulty</th>
            <th>Hints</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body">
        </tbody>
      </table>
    </div>
  </main>
  
  <script src="/static/main.js"></script>
</body>
</html>
