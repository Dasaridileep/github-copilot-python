<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="difficulty-selector">
    <label>Difficulty:</label>
    <label><input type="radio" name="difficulty" value="easy" checked> Easy (45 clues)</label>
    <label><input type="radio" name="difficulty" value="medium"> Medium (38 clues)</label>
    <label><input type="radio" name="difficulty" value="hard"> Hard (32 clues)</label>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <span id="message"></span>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
